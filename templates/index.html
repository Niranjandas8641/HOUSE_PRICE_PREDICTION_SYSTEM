<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI House Price Predictor</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 17px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .section-title {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
            color: #444;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .full {
            grid-column: 1 / -1;
        }

        .button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            opacity: 0.9;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 25px;
            border-radius: 15px;
            background: #f0f4ff;
            text-align: center;
        }

        .result h2 {
            color: #4c51bf;
        }

        .loading {
            color: #555;
        }

        .error {
            color: #dc2626;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 25px;
        }

        @media(max-width: 700px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 30px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>🏠 AI House Price Predictor</h1>

        <p>
            Machine Learning based house price prediction system
        </p>

    </div>


    <div class="card">

        <h2 class="section-title">
            Property Information
        </h2>


        <form id="predictionForm">

            <div class="grid">

                <div class="form-group full">

                    <label>Address</label>

                    <input
                        type="text"
                        id="address"
                        placeholder="Optional - Example: Seattle, WA"
                    >

                </div>


                <div class="form-group">

                    <label>Bedrooms</label>

                    <input
                        type="number"
                        id="bedrooms"
                        value="3"
                        min="1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Bathrooms</label>

                    <input
                        type="number"
                        id="bathrooms"
                        value="2"
                        step="0.25"
                        min="0.5"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Living Area (sqft)</label>

                    <input
                        type="number"
                        id="sqft_living"
                        value="1800"
                        min="100"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Lot Size (sqft)</label>

                    <input
                        type="number"
                        id="sqft_lot"
                        value="6000"
                        min="100"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Floors</label>

                    <input
                        type="number"
                        id="floors"
                        value="1"
                        min="1"
                        max="3"
                        step="0.5"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Waterfront</label>

                    <select id="waterfront">

                        <option value="0">No</option>

                        <option value="1">Yes</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>View</label>

                    <select id="view">

                        <option value="0">No View</option>

                        <option value="1">Average</option>

                        <option value="2">Good</option>

                        <option value="3">Excellent</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Condition</label>

                    <select id="condition">

                        <option value="1">Poor</option>

                        <option value="2">Below Average</option>

                        <option value="3" selected>Average</option>

                        <option value="4">Good</option>

                        <option value="5">Excellent</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Grade</label>

                    <select id="grade">

                        <option value="1">1</option>

                        <option value="2">2</option>

                        <option value="3" selected>3</option>

                        <option value="4">4</option>

                        <option value="5">5</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Year Built</label>

                    <input
                        type="number"
                        id="yr_built"
                        value="2000"
                        min="1900"
                        max="2026"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Year Renovated</label>

                    <input
                        type="number"
                        id="yr_renovated"
                        value="0"
                        min="0"
                        max="2026"
                    >

                </div>


                <div class="form-group">

                    <label>Basement Area (sqft)</label>

                    <input
                        type="number"
                        id="sqft_basement"
                        value="0"
                        min="0"
                    >

                </div>


                <div class="form-group">

                    <label>Zipcode</label>

                    <input
                        type="number"
                        id="zipcode"
                        value="98125"
                    >

                </div>


                <div class="form-group">

                    <label>Currency</label>

                    <select id="currency">

                        <option value="USD">USD - $</option>

                        <option value="INR">INR - ₹</option>

                        <option value="EUR">EUR - €</option>

                        <option value="GBP">GBP - £</option>

                        <option value="CAD">CAD - $</option>

                        <option value="AUD">AUD - $</option>

                        <option value="JPY">JPY - ¥</option>

                    </select>

                </div>

            </div>


            <button
                type="submit"
                class="button"
            >
                🔮 Predict House Price
            </button>

        </form>


        <div
            id="result"
            class="result"
        ></div>

    </div>


    <div class="footer">

        <p>
            Built with Python • Scikit-learn • Flask
        </p>

    </div>

</div>


<script>

document
.getElementById("predictionForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const resultBox =
        document.getElementById("result");


    resultBox.style.display = "block";

    resultBox.innerHTML =
        '<div class="loading">⏳ Calculating house price...</div>';


    const data = {

        address:
            document.getElementById("address").value,

        bedrooms:
            document.getElementById("bedrooms").value,

        bathrooms:
            document.getElementById("bathrooms").value,

        sqft_living:
            document.getElementById("sqft_living").value,

        sqft_lot:
            document.getElementById("sqft_lot").value,

        floors:
            document.getElementById("floors").value,

        waterfront:
            document.getElementById("waterfront").value,

        view:
            document.getElementById("view").value,

        condition:
            document.getElementById("condition").value,

        grade:
            document.getElementById("grade").value,

        sqft_above:
            document.getElementById("sqft_living").value,

        sqft_basement:
            document.getElementById("sqft_basement").value,

        yr_built:
            document.getElementById("yr_built").value,

        yr_renovated:
            document.getElementById("yr_renovated").value,

        zipcode:
            document.getElementById("zipcode").value,

        lat: 47.72,

        long: -122.32,

        currency:
            document.getElementById("currency").value

    };


    try {

        const response = await fetch(
            "/predict",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)
            }
        );


        const result =
            await response.json();


        if (result.error) {

            resultBox.innerHTML =
                '<div class="error">❌ ' +
                result.error +
                '</div>';

            return;

        }


        const currency =
            data.currency;


        const symbols = {

            USD: "$",

            INR: "₹",

            EUR: "€",

            GBP: "£",

            CAD: "C$",

            AUD: "A$",

            JPY: "¥"

        };


        const symbol =
            symbols[currency] || "$";


        resultBox.innerHTML = `

            <h2>🏠 Predicted House Price</h2>

            <h1>
                ${symbol}${result.prediction.toLocaleString()}
                ${currency}
            </h1>

            <p>
                Prediction generated using the trained
                machine learning model.
            </p>

        `;

    }

    catch(error) {

        resultBox.innerHTML =
            '<div class="error">' +
            '❌ Unable to connect to server.' +
            '</div>';

    }

});

</script>

</body>

</html>
